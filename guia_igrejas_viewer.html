<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="pages.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplicativo para Igrejas – Guia</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --accent: #c8a96e;
    --text: #e8e8e8;
    --muted: #888;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    overflow-x: hidden;
  }
  #cover {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    transition: opacity 0.5s ease;
    padding: 20px;
    text-align: center;
  }
  #cover.hide { opacity: 0; pointer-events: none; }
  #cover img { max-height: 50vh; width: auto; object-fit: contain; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  #cover h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--accent); margin-bottom: 10px; }
  #cover p { color: var(--muted); margin-bottom: 30px; font-weight: 300; }
  #cover button { background: var(--accent); color: var(--bg); border: none; padding: 14px 36px; font-size: 1rem; font-weight: 500; border-radius: 4px; cursor: pointer; transition: transform 0.2s, opacity 0.2s; }
  #cover button:hover { transform: translateY(-2px); opacity: 0.9; }

  #app { width: 100%; max-width: 800px; display: flex; flex-direction: column; min-height: 100vh; position: relative; padding-bottom: 140px; }
  
  #topbar { width: 100%; height: 60px; background: rgba(15,15,15,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
  #topbar h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--accent); font-weight: 400; }
  #topbar-pages { font-size: 0.9rem; color: var(--muted); font-weight: 300; }

  #viewer-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; }
  #page-container { position: relative; width: 100%; max-width: 500px; background: var(--surface); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); overflow: hidden; border: 1px solid var(--border); aspect-ratio: 1 / 1.414; }
  #page-img { width: 100%; height: 100%; object-fit: contain; display: block; transition: opacity 0.3s ease; }
  #page-img.loading { opacity: 0.3; }

  .link-overlay {
    position: absolute;
    left: 10%;
    width: 80%;
    background: rgba(200, 169, 110, 0.0); /* Deixado invisível sobre a imagem */
    cursor: pointer;
    border-radius: 6px;
  }

  #nav-controls { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 800px; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 40; }
  .nav-buttons { display: flex; align-items: center; gap: 20px; }
  .nav-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: background 0.2s, border-color 0.2s; }
  .nav-btn:hover:not(:disabled) { background: var(--border); border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #page-num { font-size: 0.9rem; color: var(--text); font-weight: 400; min-width: 60px; text-align: center; }
  #page-num span { color: var(--muted); font-weight: 300; }

  .swipe-hint { font-size: 0.8rem; color: var(--muted); font-weight: 300; letter-spacing: 0.5px; }

  #thumbs { width: 100%; overflow-x: auto; display: flex; gap: 10px; padding: 10px 20px; background: var(--surface); border-top: 1px solid var(--border); display: none; }
  .thumb { width: 50px; height: 70px; flex-shrink: 0; border-radius: 4px; overflow: hidden; border: 2px solid transparent; cursor: pointer; opacity: 0.5; transition: opacity 0.2s; }
  .thumb.active { border-color: var(--accent); opacity: 1; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }

  @media (min-width: 1024px) {
    #thumbs { display: flex; }
  }
</style>
</head>
<body>

<div id="cover">
  <img id="cover-img" src="" alt="Capa">
  <h1>Aplicativo para Igrejas</h1>
  <p>Guia Completo de Demonstração</p>
  <button onclick="startViewer()">Toque para ler</button>
</div>

<div id="app">
  <div id="topbar">
    <h2>Aplicativo para Igrejas</h2>
    <div id="topbar-pages">1 / 10</div>
  </div>

  <div id="viewer-container">
    <div id="page-container">
      <img id="page-img" src="" alt="Página">
    </div>
  </div>

  <div id="nav-controls">
    <div class="nav-buttons">
      <button class="nav-btn" id="btn-prev" onclick="goTo(current - 1)" aria-label="Página anterior">←</button>
      <div id="page-num">1 <span>/ 10</span></div>
      <button class="nav-btn" id="btn-next" onclick="goTo(current + 1)" aria-label="Próxima página">→</button>
    </div>
    <div class="swipe-hint">← deslize ou use as setas →</div>
  </div>

  <div id="thumbs"></div>
</div>

<script>
// Molde inicial caso falte o carregamento
const PAGES = Array(10).fill("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='707' viewBox='0 0 500 707'><rect width='100%' height='100%' fill='%231a1a1a'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='24' fill='%23c8a96e'>Carregando...</text></svg>");

// Puxa as páginas do arquivo pages.js
if (typeof BOOK_PAGES !== 'undefined') {
  PAGES.length = 0;
  PAGES.push(...BOOK_PAGES);
}

let current = 0;

function startViewer() {
  document.getElementById('cover').classList.add('hide');
  goTo(0);
}

function goTo(n) {
  if (n < 0 || n >= PAGES.length) return;
  current = n;
  const img = document.getElementById('page-img');
  img.classList.add('loading');
  img.onload = () => { 
    img.classList.remove('loading'); 
    renderLinks(n); 
  };
  img.src = PAGES[n];
  document.getElementById('page-num').innerHTML = `${n+1} <span>/ ${PAGES.length}</span>`;
  document.getElementById('topbar-pages').textContent = `${n+1} / ${PAGES.length}`;
  document.getElementById('btn-prev').disabled = n === 0;
  document.getElementById('btn-next').disabled = n === PAGES.length - 1;
  document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === n));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderLinks(n) {
  // Remove overlays de páginas anteriores
  document.querySelectorAll('.link-overlay').forEach(el => el.remove());

  // Ativa os links apenas na última página (Página 10 = Índice 9)
  if (n === 9) {
    const container = document.getElementById('page-container');
    
    // Configurações das caixas de clique baseadas nos links encurtados
    const linksData = [
      { url: 'https://bit.ly/4wNfawg', top: '42%', height: '6%' },
      { url: 'https://bit.ly/4bXgK6F', top: '51%', height: '6%' },
      { url: 'https://bit.ly/4bWpXg7', top: '60%', height: '6%' }
    ];

    linksData.forEach(data => {
      const a = document.createElement('a');
      a.className = 'link-overlay';
      a.href = data.url;
      a.target = '_blank';
      a.style.top = data.top;
      a.style.height = data.height;
      container.appendChild(a);
    });
  }
}

// Inicializar miniaturas
const thumbsEl = document.getElementById('thumbs');
PAGES.forEach((src, i) => {
  const d = document.createElement('div');
  d.className = 'thumb' + (i === 0 ? ' active' : '');
  d.onclick = () => goTo(i);
  const img = document.createElement('img');
  img.src = src; img.alt = `Página ${i+1}`;
  d.appendChild(img); thumbsEl.appendChild(d);
});

document.getElementById('cover-img').src = PAGES[0];

// Navegação por teclado
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1);
});

// Suporte para Swipe (Deslizar o dedo)
let touchX = null;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, false);
document.addEventListener('touchmove', e => {
  if (!touchX) return;
  let diff = touchX - e.touches[0].clientX;
  if (Math.abs(diff) > 50) {
    if (diff > 0) goTo(current + 1);
    else goTo(current - 1);
    touchX = null;
  }
}, false);
</script>
</body>
</html>
